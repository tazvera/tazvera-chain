<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tazvera Blockchain Explorer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1 { text-align: center; color: #58a6ff; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .block-header { font-size: 18px; font-weight: bold; color: #3fb950; margin-bottom: 10px; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .detail-row { margin: 8px 0; word-break: break-all; }
        .label { color: #8b949e; font-weight: bold; width: 140px; display: inline-block; }
        .value { color: #f0f6fc; font-family: monospace; }
        .upload-box { text-align: center; margin-bottom: 30px; background: #21262d; padding: 15px; border-radius: 8px; }
        input[type="file"] { color: #c9d1d9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ Tazvera Blockchain Explorer</h1>
        
        <div class="upload-box">
            <p>Load your <b>tazvera_chain.json</b> file generated by the C++ Core:</p>
            <input type="file" id="jsonFileInput" accept=".json">
        </div>

        <div id="blockchainContainer"></div>
    </div>

    <script>
        document.getElementById('jsonFileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    renderChain(data.chain);
                } catch (err) {
                    alert("Invalid JSON file!");
                }
            };
            reader.readAsText(file);
        });

        function renderChain(chain) {
            const container = document.getElementById('blockchainContainer');
            container.innerHTML = "";

            chain.forEach(block => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="block-header">📦 Block #${block.index}</div>
                    <div class="detail-row"><span class="label">Hash:</span> <span class="value">${block.hash}</span></div>
                    <div class="detail-row"><span class="label">Previous Hash:</span> <span class="value">${block.previousHash}</span></div>
                    <div class="detail-row"><span class="label">Nonce:</span> <span class="value">${block.nonce}</span></div>
                    <div class="detail-row"><span class="label">Data / Tx:</span> <span class="value">${block.data}</span></div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
