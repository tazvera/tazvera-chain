name: Fuzz (libFuzzer)
# Separate from the core CI on purpose: a fuzz run is slow and noisy, and a red result here is a
# question about the loader, not a broken build. Pull requests get a short smoke run; the weekly
# schedule gets the same run, so a regression cannot sit unnoticed.
on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y clang cmake libssl-dev
      - name: Configure with the fuzzers enabled
        run: >
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DTAZ_BUILD_FUZZERS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - name: Build
        run: cmake --build build-fuzz --parallel 2
      - name: Seed the corpus from the shipped chain files
        run: mkdir -p corpus/chain && cp explorer/*.json corpus/chain/ 2>/dev/null || true
      - name: Fuzz the chain-file loader (60 s)
        run: ./build-fuzz/fuzz_load_chain -max_total_time=60 -max_len=65536 -rss_limit_mb=2048 corpus/chain
      - name: Fuzz transaction shapes (60 s)
        run: ./build-fuzz/fuzz_tx -max_total_time=60 -max_len=512 -rss_limit_mb=2048
      - name: Keep any crash input for the next run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-input
          path: |
            crash-*
            corpus/chain/crash-*
          if-no-files-found: ignore
