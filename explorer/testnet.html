<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tazvera — local blockchain prototype for asset records</title>
  <meta name="description" content="TAZVERA is a local, non-EVM blockchain prototype for testing block production, transactions and on-chain asset records. Not a public testnet." />
  <meta name="theme-color" content="#050806" />
  <meta property="og:title" content="Tazvera — local blockchain prototype for asset records" />
  <meta property="og:description" content="TAZVERA is a local, non-EVM blockchain prototype for testing block production, transactions and on-chain asset records. Not a public testnet." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-24 -24 213.0 207.6'%3E%3Cpath fill='%234CF27E' d='M164.6,39.2 L157.9,45.1 L138.9,63.6 L137.0,65.0 L102.0,65.1 L101.1,65.6 L100.6,92.5 L100.8,155.9 L101.4,158.0 L103.9,159.5 L113.9,159.5 L115.8,158.6 L146.6,128.2 L164.0,110.2 L164.9,108.2Z M0.2,39.2 L0.1,108.5 L0.6,109.9 L2.2,112.1 L10.4,120.6 L47.9,158.2 L49.9,159.4 L60.2,159.5 L61.8,159.1 L63.2,157.8 L63.9,155.9 L63.6,65.5 L62.2,65.1 L30.5,65.2 L27.5,64.9 L1.0,39.4Z M0.1,29.1 L0.4,30.9 L2.9,33.6 L7.8,37.5 L11.9,39.5 L63.8,39.9 L67.0,40.9 L70.8,42.9 L75.9,48.1 L79.1,54.0 L81.8,61.9 L82.5,62.9 L86.0,52.9 L88.2,49.0 L92.8,43.9 L95.5,41.8 L97.9,40.8 L101.4,39.9 L152.6,39.6 L156.0,38.4 L158.8,36.4 L163.0,32.6 L164.9,30.1 L164.8,28.6 L163.8,27.1 L140.0,2.6 L136.6,0.0 L29.0,0.0 L27.9,0.4 L5.2,23.1 L0.5,28.1Z'/%3E%3C/svg%3E" />
  <style>
    /* ================= LOCAL FONTS ================= */
    @font-face {
      font-family: 'Space Grotesk';
      src: url('fonts/SpaceGrotesk-Medium.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Space Grotesk';
      src: url('fonts/SpaceGrotesk-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Mukta';
      src: url('fonts/Mukta-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Mukta';
      src: url('fonts/Mukta-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'IBM Plex Mono';
      src: url('fonts/IBMPlexMono-Regular.ttf') format('truetype');
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-base: #050806;
      --bg-surface: #0B100D;
      --bg-elevated: #0F1713;
      --green-bright: #4CF27E;
      --green-deep: #016B57;
      --text-white: #FFFFFF;
      --text-muted: #8C9B94;
      --text-on-green: #04120A;
      --border-subtle: rgba(140, 155, 148, 0.14);
      --border-green: rgba(76, 242, 126, 0.28);
      --font-en: 'Space Grotesk', sans-serif;
      --font-hi: 'Mukta', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-white);
      font-family: var(--font-en);
      line-height: 1.6;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 80% 10%, rgba(1, 107, 87, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 15% 60%, rgba(76, 242, 126, 0.04) 0%, transparent 40%),
        linear-gradient(rgba(140, 155, 148, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 155, 148, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      -webkit-font-smoothing: antialiased;
    }
    body.lang-hi { font-family: var(--font-hi); }
    body.lang-hi .eyebrow, body.lang-hi .meta-chip, body.lang-hi .explorer-note,
    body.lang-hi .demo-pill, body.lang-hi .warn-tag { font-family: var(--font-hi); }
    .mono { font-family: var(--font-mono); }
    .container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
      padding: 10px 14px;
      color: var(--text-on-green);
      background: var(--green-bright);
      border-radius: 6px;
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    header {
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(5, 8, 6, 0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; height: 72px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand svg { width: 26px; height: auto; display: block; flex: 0 0 auto; }
    .wordmark {
      font-family: var(--font-en);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-white);
    }
    .nav-badge {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(1, 107, 87, 0.25);
      border: 1px solid var(--green-deep);
      color: var(--green-bright);
      letter-spacing: 0.06em;
    }
    .lang-switch {
      display: inline-flex;
      align-items: center;
    }
    .lang-btn {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      color: var(--green-bright);
      background: var(--bg-surface);
      border: 1px solid var(--border-green);
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .lang-btn:hover {
      background: rgba(76, 242, 126, 0.10);
      border-color: var(--green-bright);
    }
    .lang-btn:active { transform: scale(0.96); }
    .lang-btn svg { width: 21px; height: 21px; display: block; }

    .hero-section {
      padding: 64px 0 48px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 40px;
      align-items: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--green-bright);
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--green-bright);
      box-shadow: 0 0 10px var(--green-bright);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.35; box-shadow: 0 0 3px var(--green-bright); } }
    h1 {
      font-size: clamp(2.5rem, 5vw, 3.85rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 20px;
      color: var(--text-white);
    }
    body.lang-hi h1 { line-height: 1.25; letter-spacing: 0; }
    .hero-desc { font-size: 1.15rem; color: var(--text-muted); max-width: 480px; margin-bottom: 32px; }
    .hero-meta-strip { display: flex; flex-wrap: wrap; gap: 12px; }
    .meta-chip {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .meta-chip span { color: var(--text-white); }

    .status-card {
      background: linear-gradient(165deg, var(--bg-elevated) 0%, var(--bg-surface) 100%);
      border: 1px solid var(--border-green);
      border-radius: 16px;
      padding: 28px;
      position: relative;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.6);
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .status-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-white);
    }
    .demo-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--green-bright);
      color: var(--text-on-green);
      padding: 3px 9px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stat-box {
      background: rgba(5, 8, 6, 0.65);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px;
      min-width: 0;
    }
    .stat-label { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 4px; }
    .stat-value {
      font-family: var(--font-mono);
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--text-white);
      overflow-wrap: anywhere;
    }
    .stat-value.accent { color: var(--green-bright); }

    .section-block { padding: 40px 0; }
    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 24px;
    }
    .section-heading h2, .info-heading { font-size: 1.65rem; font-weight: 700; }
    .explorer-note {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-muted);
      border: 1px dashed var(--green-deep);
      padding: 5px 12px;
      border-radius: 6px;
      max-width: 480px;
    }
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .step-card, .info-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 24px;
      transition: border-color 0.2s ease;
    }
    .step-card:hover, .info-card:hover { border-color: var(--green-deep); }
    .step-num {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--green-bright);
      color: var(--text-on-green);
      padding: 3px 10px;
      border-radius: 5px;
      margin-bottom: 16px;
    }
    .step-card h3 { font-size: 1.15rem; margin-bottom: 8px; color: var(--text-white); }
    .step-card p, .info-card p, .limits-list li { font-size: 0.94rem; color: var(--text-muted); }
    .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .info-card h2 { font-size: 1.35rem; margin-bottom: 10px; }
    .limits-list { list-style: none; display: grid; gap: 10px; }
    .limits-list li { position: relative; padding-left: 18px; }
    .limits-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.72em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-bright);
    }
    .issue-link {
      display: inline-block;
      margin-top: 14px;
      color: var(--green-bright);
      text-decoration: underline;
      text-underline-offset: 4px;
      font-weight: 700;
    }

    .warning-box {
      margin: 24px 0 48px;
      background: rgba(1, 107, 87, 0.08);
      border: 1px solid var(--green-deep);
      border-left: 4px solid var(--green-bright);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .warn-tag {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      background: var(--green-bright);
      color: var(--text-on-green);
      padding: 4px 10px;
      border-radius: 4px;
      white-space: nowrap;
      margin-top: 2px;
    }
    .warn-content h4 { font-size: 1rem; margin-bottom: 4px; color: var(--text-white); }
    .warn-content p { font-size: 0.92rem; color: var(--text-muted); }

    footer { border-top: 1px solid var(--border-subtle); padding: 24px 0; color: var(--text-muted); font-size: 0.85rem; }
    .footer-inner { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }

    a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--green-bright);
      outline-offset: 4px;
      border-radius: 4px;
    }

    @media (max-width: 860px) {
      .hero-section { grid-template-columns: 1fr; padding: 40px 0 32px; gap: 32px; }
      .steps-grid { grid-template-columns: 1fr; }
      .section-heading { flex-direction: column; align-items: flex-start; gap: 10px; }
      .warning-box { flex-direction: column; gap: 10px; }
    }
    @media (max-width: 620px) {
      .info-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .status-grid { grid-template-columns: 1fr; }
      .wordmark { font-size: 1.15rem; }
      .nav-inner { gap: 10px; }
      .brand { gap: 8px; }
      .nav-badge { font-size: 0.62rem; }
      .lang-btn { padding: 6px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="skip_link"></a>

  <!-- TOP BAR -->
  <header>
    <div class="container nav-inner">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 213.0 207.6" role="img" aria-label="Tazvera"><title>Tazvera</title><path fill="#4CF27E" d="M164.6,39.2 L157.9,45.1 L138.9,63.6 L137.0,65.0 L102.0,65.1 L101.1,65.6 L100.6,92.5 L100.8,155.9 L101.4,158.0 L103.9,159.5 L113.9,159.5 L115.8,158.6 L146.6,128.2 L164.0,110.2 L164.9,108.2Z M0.2,39.2 L0.1,108.5 L0.6,109.9 L2.2,112.1 L10.4,120.6 L47.9,158.2 L49.9,159.4 L60.2,159.5 L61.8,159.1 L63.2,157.8 L63.9,155.9 L63.6,65.5 L62.2,65.1 L30.5,65.2 L27.5,64.9 L1.0,39.4Z M0.1,29.1 L0.4,30.9 L2.9,33.6 L7.8,37.5 L11.9,39.5 L63.8,39.9 L67.0,40.9 L70.8,42.9 L75.9,48.1 L79.1,54.0 L81.8,61.9 L82.5,62.9 L86.0,52.9 L88.2,49.0 L92.8,43.9 L95.5,41.8 L97.9,40.8 L101.4,39.9 L152.6,39.6 L156.0,38.4 L158.8,36.4 L163.0,32.6 L164.9,30.1 L164.8,28.6 L163.8,27.1 L140.0,2.6 L136.6,0.0 L29.0,0.0 L27.9,0.4 L5.2,23.1 L0.5,28.1Z"/></svg>
        <span class="wordmark">TAZVERA</span>
        <span class="nav-badge" data-i18n="top_badge"></span>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" id="lang-toggle" type="button" onclick="toggleLang()" aria-label="Switch language to Hindi" title="Switch language to Hindi">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="9.25"></circle>
            <path d="M2.9 12h18.2M12 2.75c2.35 2.5 3.55 5.58 3.55 9.25S14.35 18.75 12 21.25C9.65 18.75 8.45 15.67 8.45 12S9.65 5.25 12 2.75Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container" id="main-content">
    <section class="hero-section">
      <div>
        <div class="eyebrow">
          <span class="pulse-dot" aria-hidden="true"></span>
          <span data-i18n="eyebrow"></span>
        </div>
        <h1 data-i18n="hero_title"></h1>
        <p class="hero-desc" data-i18n="hero_desc"></p>
        <div class="hero-meta-strip">
          <div class="meta-chip"><span data-i18n="chip_architecture"></span> <span>Custom Non-EVM</span></div>
          <div class="meta-chip"><span data-i18n="chip_status"></span> <span data-i18n="chip_status_value"></span></div>
        </div>
      </div>

      <aside class="status-card" aria-label="Sample chain data">
        <div class="status-header">
          <span class="status-title" data-i18n="card_title"></span>
          <span class="demo-pill" data-i18n="card_pill"></span>
        </div>
        <div class="status-grid">
          <div class="stat-box">
            <div class="stat-label" data-i18n="cell_environment"></div>
            <div class="stat-value accent" data-i18n="cell_environment_value"></div>
          </div>
          <div class="stat-box">
            <div class="stat-label" data-i18n="cell_height"></div>
            <div class="stat-value" data-i18n="cell_height_value"></div>
          </div>
          <div class="stat-box">
            <div class="stat-label" data-i18n="cell_consensus"></div>
            <div class="stat-value" data-i18n="cell_consensus_value"></div>
          </div>
          <div class="stat-box">
            <div class="stat-label" data-i18n="cell_explorer"></div>
            <div class="stat-value" data-i18n="cell_explorer_value"></div>
          </div>
        </div>
      </aside>
    </section>

    <section class="section-block">
      <div class="section-heading">
        <h2 data-i18n="run_heading"></h2>
        <div class="explorer-note" data-i18n="run_note"></div>
      </div>
      <div class="steps-grid">
        <div class="step-card">
          <span class="step-num">01</span>
          <h3 data-i18n="step1_title"></h3>
          <p data-i18n="step1_body"></p>
        </div>
        <div class="step-card">
          <span class="step-num">02</span>
          <h3 data-i18n="step2_title"></h3>
          <p data-i18n="step2_body"></p>
        </div>
        <div class="step-card">
          <span class="step-num">03</span>
          <h3 data-i18n="step3_title"></h3>
          <p data-i18n="step3_body"></p>
        </div>
      </div>
    </section>

    <section class="section-block info-grid" aria-label="Prototype information">
      <article class="info-card">
        <h2 class="info-heading" data-i18n="what_for_heading"></h2>
        <p data-i18n="what_for_body"></p>
      </article>
      <article class="info-card">
        <h2 class="info-heading" data-i18n="limits_heading"></h2>
        <ul class="limits-list">
          <li data-i18n="limit1"></li>
          <li data-i18n="limit2"></li>
          <li data-i18n="limit3"></li>
          <li data-i18n="limit4"></li>
          <li data-i18n="limit5"></li>
        </ul>
      </article>
      <article class="info-card">
        <h2 class="info-heading" data-i18n="before_heading"></h2>
        <p data-i18n="before_body"></p>
      </article>
      <article class="info-card">
        <h2 class="info-heading" data-i18n="report_heading"></h2>
        <p data-i18n="report_body"></p>
        <a class="issue-link" href="https://github.com/tazvera/tazvera-chain/issues" target="_blank" rel="noopener noreferrer" data-i18n="report_link"></a>
      </article>
    </section>

    <section class="warning-box" role="alert">
      <span class="warn-tag" data-i18n="notice_tag"></span>
      <div class="warn-content">
        <h4 data-i18n="notice_heading"></h4>
        <p data-i18n="notice_body"></p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container footer-inner">
      <span class="mono" data-i18n="footer_left"></span>
      <span data-i18n="footer_right"></span>
    </div>
  </footer>

  <script>
    const TEXT = {
      "skip_link": {
        "en": "Skip to content",
        "hi": "मुख्य सामग्री पर जाएँ"
      },
      "top_badge": {
        "en": "LOCAL PROTOTYPE",
        "hi": "लोकल प्रोटोटाइप"
      },
      "eyebrow": {
        "en": "NON-EVM BLOCKCHAIN PROTOTYPE",
        "hi": "नॉन-ईवीएम ब्लॉकचेन प्रोटोटाइप"
      },
      "hero_title": {
        "en": "A local blockchain prototype<br>for asset records.",
        "hi": "संपत्ति रिकॉर्ड के लिए<br>एक लोकल ब्लॉकचेन प्रोटोटाइप।"
      },

    function toggleLang() {
      const current = document.documentElement.lang === 'hi' ? 'hi' : 'en';
      setLang(current === 'en' ? 'hi' : 'en');
    }

    function setLang(lang) {
      const selected = lang === 'hi' ? 'hi' : 'en';
      document.documentElement.lang = selected;
      document.body.classList.toggle('lang-hi', selected === 'hi');

      document.querySelectorAll('[data-i18n]').forEach((element) => {
        const key = element.getAttribute('data-i18n');
        const entry = TEXT[key];
        if (entry && typeof entry[selected] === 'string') {
          element.innerHTML = entry[selected];
        }
      });

      const langToggle = document.getElementById('lang-toggle');
      const nextLanguage = selected === 'en' ? 'Hindi' : 'English';
      const accessibleLabel = 'Switch language to ' + nextLanguage;
      langToggle.setAttribute('aria-label', accessibleLabel);
      langToggle.setAttribute('title', accessibleLabel);

      try {
        localStorage.setItem('tz_lang', selected);
      } catch (error) {
        // Language switching remains available when storage is blocked.
      }
    }

    (function initLanguage() {
      let saved = 'en';
      try {
        const stored = localStorage.getItem('tz_lang');
        if (stored === 'en' || stored === 'hi') saved = stored;
      } catch (error) {
        // Use English when local storage is unavailable.
      }
      setLang(saved);
    })();
  </script>
