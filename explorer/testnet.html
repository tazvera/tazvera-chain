<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A0C0B">
  <title>Tazvera Testnet</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("./fonts/SpaceGrotesk[wght].woff2") format("woff2");
      font-style: normal; font-weight: 300 700; font-display: swap;
    }
    @font-face {
      font-family: "Mukta";
      src: url("./fonts/Mukta[wght].woff2") format("woff2");
      font-style: normal; font-weight: 300 700; font-display: swap;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("./fonts/IBMPlexMono[wght].woff2") format("woff2");
      font-style: normal; font-weight: 100 700; font-display: swap;
    }
    :root {
      color-scheme: dark;
      --black: #0A0C0B;
      --white: #FFFFFF;
      --green: #4CF27E;
      --gray: #8C9B94;
      --panel: #111713;
      --line: #26332B;
      --body-font: "Space Grotesk", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--black); }
    body {
      margin: 0; min-height: 100vh; background: var(--black); color: var(--white);
      font-family: var(--body-font); line-height: 1.55;
      padding: 24px 20px 64px;
    }
    body[data-language="hi"] { --body-font: "Mukta", sans-serif; }
    .wrap { width: min(100%, 920px); margin: 0 auto; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; padding: 4px 0 28px; }
    #brand-logo { width: 1px; height: 1px; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .language { display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:999px; padding:6px 10px; }
    .language button { border:0; background:transparent; color:var(--gray); padding:4px 2px; font:inherit; cursor:pointer; }
    .language button[aria-pressed="true"] { color:var(--green); font-weight:700; }
    .language span { color:var(--gray); }
    h1 { margin:12px 0 10px; font-size:clamp(38px,7vw,66px); line-height:1.04; letter-spacing:-.055em; }
    h2 { margin:0; font-size:19px; letter-spacing:-.02em; }
    p { margin:0; }
    .tagline { max-width:650px; color:var(--gray); font-size:18px; }
    .status { margin-top:34px; padding:22px; border:1px solid var(--line); border-radius:18px; background:var(--panel); }
    .status-head { display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap; }
    .pill { display:inline-flex; align-items:center; gap:8px; color:var(--green); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    .dot { width:8px; height:8px; border-radius:50%; background:var(--green); }
    .demo { color:var(--black); background:var(--green); border-radius:5px; padding:4px 8px; font-size:11px; font-weight:800; letter-spacing:.08em; }
    .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:22px; }
    .stat { min-width:0; padding:14px; background:var(--black); border:1px solid var(--line); border-radius:12px; }
    .stat-label { color:var(--gray); font-size:12px; }
    .stat-value { margin-top:5px; font-size:20px; font-weight:700; overflow-wrap:anywhere; }
    .mono { font-family:"IBM Plex Mono",monospace; font-size:12px; overflow-wrap:anywhere; }
    .section { margin-top:38px; }
    .section-title { margin-bottom:16px; }
    .steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .step { padding:18px; border:1px solid var(--line); border-radius:14px; background:var(--panel); }
    .step-no { color:var(--green); font-family:"IBM Plex Mono",monospace; font-size:12px; }
    .step h2 { margin:12px 0 7px; }
    .step p { color:var(--gray); font-size:14px; }
    .warning { margin-top:30px; padding:20px; border:1px solid #526052; border-left:4px solid var(--green); border-radius:12px; background:#101510; }
    .warning h2 { margin-bottom:8px; }
    .warning p { color:var(--gray); font-size:14px; }
    .warning ul { margin:12px 0 0; padding-left:20px; color:var(--white); font-size:14px; }
    .warning li + li { margin-top:5px; }
    .footer { margin-top:28px; color:var(--gray); font-size:12px; }
    .lang-hi { font-family:"Mukta",sans-serif; }
    button:focus-visible { outline:2px solid var(--green); outline-offset:4px; }
    @media (max-width:650px) {
      body { padding:18px 16px 48px; }
      .stats,.steps { grid-template-columns:1fr; }
      .stat-value { font-size:18px; }
      .status { padding:16px; }
    }
  </style>
</head>
<body data-language="en">
  <main class="wrap">
    <nav class="topbar" aria-label="Page controls">
      <div id="brand-logo"></div>
      <div class="language" role="group" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
        <span aria-hidden="true">|</span>
        <button type="button" id="lang-hi" aria-pressed="false">हिंदी</button>
      </div>
    </nav>

    <header>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
      <p class="tagline" data-i18n="tagline"></p>
    </header>

    <section class="status" aria-labelledby="status-title">
      <div class="status-head">
        <div class="pill"><span class="dot" aria-hidden="true"></span><span data-i18n="statusLabel"></span></div>
        <span class="demo" data-i18n="demoBadge"></span>
      </div>
      <div class="stats">
        <article class="stat">
          <div class="stat-label" id="status-title" data-i18n="networkLabel"></div>
          <div class="stat-value">TAZVERA TESTNET</div>
        </article>
        <article class="stat">
          <div class="stat-label" data-i18n="heightLabel"></div>
          <div class="stat-value">1,284</div>
        </article>
        <article class="stat">
          <div class="stat-label" data-i18n="validatorsLabel"></div>
          <div class="stat-value">21</div>
        </article>
      </div>
      <div class="section">
        <div class="stat-label" data-i18n="genesisLabel"></div>
        <p class="mono">0x7a91c3e8d42f6b105e9a4c71f0832d6b</p>
      </div>
      <p class="footer" data-i18n="demoNotice"></p>
    </section>

    <section class="section" aria-labelledby="join-title">
      <div class="section-title"><h2 id="join-title" data-i18n="joinTitle"></h2></div>
      <div class="steps">
        <article class="step"><div class="step-no">01</div><h2 data-i18n="step1Title"></h2><p data-i18n="step1Body"></p></article>
        <article class="step"><div class="step-no">02</div><h2 data-i18n="step2Title"></h2><p data-i18n="step2Body"></p></article>
        <article class="step"><div class="step-no">03</div><h2 data-i18n="step3Title"></h2><p data-i18n="step3Body"></p></article>
      </div>
    </section>

    <aside class="warning" role="note">
      <h2 data-i18n="warningTitle"></h2>
      <p data-i18n="warningIntro"></p>
      <ul>
        <li data-i18n="warning1"></li>
        <li data-i18n="warning2"></li>
        <li data-i18n="warning3"></li>
        <li data-i18n="warning4"></li>
      </ul>
    </aside>
    <p class="footer" data-i18n="footer"></p>
  </main>

  <script>
    "use strict";
    const T = {
      eyebrow: { en: "THE TAZVERA NETWORK", hi: "ताज़वेरा नेटवर्क" },
      title: { en: "Your network. Your rules.", hi: "आपका नेटवर्क। आपके नियम।" },
      tagline: { en: "Explore the Tazvera testnet and learn how to take part in the network.", hi: "Tazvera testnet देखें और जानें कि नेटवर्क में कैसे भाग लें।" },
      statusLabel: { en: "Sample network status", hi: "नेटवर्क की नमूना स्थिति" },
      demoBadge: { en: "DEMO DATA", hi: "डेमो डेटा" },
      networkLabel: { en: "Network", hi: "नेटवर्क" },
      heightLabel: { en: "Block height", hi: "Block height" },
      validatorsLabel: { en: "Validators (sample)", hi: "Validators (नमूना)" },
      genesisLabel: { en: "Genesis hash (sample)", hi: "Genesis hash (नमूना)" },
      demoNotice: { en: "Illustrative sample values only. This page is not connected to a live node.", hi: "ये केवल उदाहरण के लिए नमूना मान हैं। यह पेज किसी live node से जुड़ा नहीं है।" },
      joinTitle: { en: "How to join", hi: "कैसे जुड़ें" },
      step1Title: { en: "Prepare your node", hi: "अपना node तैयार करें" },
      step1Body: { en: "Review the testnet requirements and prepare a supported environment.", hi: "Testnet की ज़रूरतें देखें और सही environment तैयार करें।" },
      step2Title: { en: "Connect safely", hi: "सुरक्षित तरीके से जुड़ें" },
      step2Body: { en: "Use only the official configuration shared by the Tazvera team.", hi: "Tazvera टीम की दी हुई आधिकारिक configuration ही इस्तेमाल करें।" },
      step3Title: { en: "Verify the network", hi: "नेटवर्क की जाँच करें" },
      step3Body: { en: "Check the genesis hash and block data before participating.", hi: "भाग लेने से पहले Genesis hash और block data जाँचें।" },
      warningTitle: { en: "Important: experimental prototype", hi: "ज़रूरी सूचना: यह प्रयोगात्मक prototype है" },
      warningIntro: { en: "This demonstration is not a production network. Do not send funds or rely on it for real-world transactions.", hi: "यह प्रदर्शन production network नहीं है। इसमें पैसे न भेजें और असली लेन-देन के लिए इस पर भरोसा न करें।" },
      warning1: { en: "Prototype only — functionality and network status may change.", hi: "केवल prototype — सुविधाएँ और नेटवर्क की स्थिति बदल सकती हैं।" },
      warning2: { en: "No real money or real-value assets. Do not use valuable funds.", hi: "कोई असली पैसा या मूल्यवान संपत्ति नहीं। कीमती funds इस्तेमाल न करें।" },
      warning3: { en: "No TLS is configured for this demonstration.", hi: "इस प्रदर्शन में TLS उपलब्ध नहीं है।" },
      warning4: { en: "No payment path is implemented or available.", hi: "कोई payment path लागू या उपलब्ध नहीं है।" },
      footer: { en: "Tazvera Testnet • Demonstration page • Not connected to a live node", hi: "Tazvera Testnet • प्रदर्शन पेज • live node से जुड़ा नहीं है" }
    };

    const STORAGE_KEY = "tazvera-testnet-language";
    const pageText = (key, language) => T[key][language];

    function setLanguage(language) {
      const active = language === "hi" ? "hi" : "en";
      document.documentElement.lang = active;
      document.body.dataset.language = active;
      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.dataset.i18n;
        if (T[key]) node.textContent = pageText(key, active);
      });
      document.getElementById("lang-en").setAttribute("aria-pressed", String(active === "en"));
      document.getElementById("lang-hi").setAttribute("aria-pressed", String(active === "hi"));
      try { localStorage.setItem(STORAGE_KEY, active); } catch (_) { /* Storage may be disabled. */ }
    }

    let initialLanguage = "en";
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved === "en" || saved === "hi") initialLanguage = saved;
    } catch (_) { /* First visit defaults to English when storage is unavailable. */ }

    document.getElementById("lang-en").addEventListener("click", () => setLanguage("en"));
    document.getElementById("lang-hi").addEventListener("click", () => setLanguage("hi"));
    setLanguage(initialLanguage);
  </script>
</body>
</html>
