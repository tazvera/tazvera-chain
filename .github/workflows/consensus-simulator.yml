name: Consensus Simulator Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'design/**'

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run simulator unit tests
        run: python -m unittest discover -s tests -p 'test_consensus_simulator.py' -v
