name: Windows (experimental)
# Separate from "C++ Core CI" on purpose: this build has never been run by the author.
# A red result here is information about Windows support, not about the Linux core.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
jobs:
  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
      - name: Configure
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-win --parallel 2
      - name: Test
        run: ctest --test-dir build-win --output-on-failure
