name: C++ Core CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Explorer agrees with the core
        # v8.10: the browser verifier is a second implementation of the same rules. It drifted from the C++
        # once already (the veto-postpone rule) and then called a valid chain broken. This runs the explorer's
        # own code in Node against every demo chain and fails if the two disagree.
        run: node explorer/check_demos.js
      - name: Explorer page is up to date
        # explorer/index.html is generated (page.src.html + the demo JSON). Nothing rebuilds it automatically.
        run: |
          python3 explorer/build.py
          git diff --exit-code -- explorer/index.html
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libssl-dev
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build-san --parallel 2
      - name: Test
        run: ctest --test-dir build-san --output-on-failure
