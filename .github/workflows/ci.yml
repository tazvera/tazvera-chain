name: C++ Core CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # v9.0: the Ubuntu mirrors answer 503 often enough that a flaky mirror was failing a green commit.
      # Retries and a longer timeout make the install step survive that without hiding a real failure.
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends cmake g++ libssl-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120
      - name: Chains the core wrote for the veto rules
        run: |
          mkdir -p gen
          ./build/taz_gen_veto_demo gen
      - name: Explorer agrees with the core
        run: node explorer/check_demos.js gen
      - name: Explorer page is up to date
        run: |
          python3 explorer/build.py
          git diff --exit-code -- explorer/index.html
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # v9.0: the Ubuntu mirrors answer 503 often enough that a flaky mirror was failing a green commit.
      # Retries and a longer timeout make the install step survive that without hiding a real failure.
      - name: Install dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends cmake g++ libssl-dev
      - name: Configure (ASan + UBSan)
        run: cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
      - name: Build
        run: cmake --build build-san --parallel 2
      - name: Test
        run: ctest --test-dir build-san --output-on-failure --timeout 120
