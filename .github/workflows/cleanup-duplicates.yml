name: Remove duplicate root files
on:
  push:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Delete the copies that belong in subdirectories
        run: |
          set -euo pipefail
          git config user.name "TAZVERA cleanup"
          git config user.email "cleanup@tazvera.invalid"
          removed=0
          for f in block.cpp block.hpp build.py chain.cpp chain.hpp ci.yml crypto.cpp crypto.hpp \
                   demo_chain.json demo_recovery_chain.json demo_safety_chain.json \
                   export.cpp export.hpp export_demo.cpp fuzz.yml fuzz_load_chain.cpp fuzz_tx.cpp \
                   index.html json_io.hpp main.cpp mempool.cpp mempool.hpp page.src.html \
                   persist.cpp persist.hpp script.src.js state.cpp state.hpp \
                   test_core.cpp test_export.cpp test_mempool.cpp test_persist.cpp \
                   test_recovery.cpp test_safety.cpp test_security82.cpp \
                   tx.cpp tx.hpp types.hpp windows.yml \
                   .github/workflows/cleanup-duplicates.yml ; do
            if [ -f "$f" ]; then git rm -q "$f"; removed=$((removed+1)); fi
          done
          echo "removed $removed files"
          if [ "$removed" -eq 0 ]; then echo "nothing to remove"; exit 0; fi
          git commit -m "chore: remove duplicate files that belong in src/, include/taz/, tests/, explorer/ and .github/workflows/"
          git push
