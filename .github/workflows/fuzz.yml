name: Fuzz (libFuzzer)
on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  fuzz:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang 22 and OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y clang-22 cmake libssl-dev
      - name: Verify C++26 compiler mode
        run: |
          clang++-22 --version
          printf 'int main(){}\n' | clang++-22 -std=c++2c -x c++ -fsyntax-only -
      - name: Configure with the fuzzers enabled
        run: >
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_BUILD_TYPE=Debug
          -DTAZ_BUILD_FUZZERS=ON
          -DCMAKE_CXX_FLAGS="-std=c++2c -fsanitize=address,undefined -fno-omit-frame-pointer -g"
      - name: Build
        run: cmake --build build-fuzz --parallel 2
      - name: Seed the corpus from the shipped chain files
        run: mkdir -p corpus/chain && cp explorer/*.json corpus/chain/ 2>/dev/null || true
      - name: Fuzz the chain-file loader (60 s)
        run: ./build-fuzz/fuzz_load_chain -max_total_time=60 -max_len=65536 -rss_limit_mb=2048 corpus/chain
      - name: Fuzz transaction shapes (60 s)
        run: ./build-fuzz/fuzz_tx -max_total_time=60 -max_len=512 -rss_limit_mb=2048
      - name: Keep any crash input for the next run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-input
          path: |
            crash-*
            corpus/chain/crash-*
          if-no-files-found: ignore
